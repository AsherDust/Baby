name: 测试

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 逻辑测试用 macOS 自带的 JavaScriptCore，页面测试用无头 Chrome，macOS 的机器上都装好了
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 逻辑测试
        run: sh tests/run.sh
      - name: 页面测试
        run: sh tests/browser/run.sh
        env:
          KEEP: ${{ runner.temp }}/page-tests
      # 没通过的那几组：Chrome 吐出来的页面和日志，下载下来看现场
      - name: 留下没通过的页面
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: page-tests
          path: ${{ runner.temp }}/page-tests
          if-no-files-found: ignore
