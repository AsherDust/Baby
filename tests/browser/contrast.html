<!doctype html><meta charset="utf-8"><body><pre id="out">RUNNING</pre>
<script src="load-core.js"></script>
<script src="scenes.js"></script>
<script>
// 文字和背景的对比度：每一页和几个弹出面板都查一遍，太淡的列出来。
// run.sh 里的 contrast:dark 让浏览器按深色模式再跑一遍。
const out = [];
const log = (ok, name, extra = '') => {
  out.push(`${ok ? 'PASS' : 'FAIL'} ${name}${extra && !ok ? ` — ${extra}` : ''}`);
  document.getElementById('out').textContent = `RUNNING\n${out.join('\n')}`;
};
const TODAY = '2026-10-12';
const KEY = 'pregnancy-desk:v1';
const DARK = matchMedia('(prefers-color-scheme: dark)').matches;
const MIN_RATIO = 3;
const iframe = document.createElement('iframe');
iframe.style.cssText = 'width:390px;height:844px';
document.body.appendChild(iframe);
let w, d;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const open = (scene, route) => {
  localStorage.clear();
  const s = seedScene(scene);
  if (s) localStorage.setItem(KEY, JSON.stringify(s));
  return new Promise((r) => {
    iframe.onload = r;
    iframe.src = `../../index.html?today=${TODAY}&n=${Math.random()}#/${route}`;
  }).then(() => { w = iframe.contentWindow; d = iframe.contentDocument; });
};

const rgba = (str) => {
  const m = /rgba?\(([^)]+)\)/.exec(str);
  if (!m) return null;
  const [r, g, b, a = 1] = m[1].split(/[\s,/]+/).filter(Boolean).map(Number);
  return { r, g, b, a };
};
const colorsIn = (str) => (str.match(/rgba?\([^)]+\)/g) || []).map(rgba);
const over = (top, under) => {
  const a = top.a + under.a * (1 - top.a);
  if (!a) return { r: 0, g: 0, b: 0, a: 0 };
  const mix = (k) => (top[k] * top.a + under[k] * under.a * (1 - top.a)) / a;
  return { r: mix('r'), g: mix('g'), b: mix('b'), a };
};
const lum = (c) => {
  const f = (v) => { const s = v / 255; return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4; };
  return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b);
};
const ratio = (a, b) => { const [hi, lo] = [lum(a), lum(b)].sort((x, y) => y - x); return (hi + 0.05) / (lo + 0.05); };
const hex = (c) => `#${[c.r, c.g, c.b].map((v) => Math.round(v).toString(16).padStart(2, '0')).join('')}`;

// 从元素往外找背景，一直叠到不透明为止；渐变取每个色标，最后按最差的算
function backgrounds(el) {
  const layers = [];
  let fade = 1;
  for (let n = el; n; n = n.parentElement) {
    const cs = w.getComputedStyle(n);
    const solid = rgba(cs.backgroundColor);
    const stops = /gradient/.test(cs.backgroundImage) ? colorsIn(cs.backgroundImage) : [];
    if (stops.length) layers.push(stops);
    if (solid && solid.a > 0) layers.push([solid]);
    const opaque = (solid && solid.a === 1) || (stops.length && stops.every((c) => c.a === 1));
    if (opaque) break;
    fade *= Number(cs.opacity);
  }
  let under = [{ r: 255, g: 255, b: 255, a: 1 }];
  for (const layer of layers.reverse()) under = layer.flatMap((top) => under.map((u) => over(top, u))).slice(0, 24);
  return { under, fade };
}

function audit(root, where) {
  const seen = new Set();
  const targets = [];
  const walker = d.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let t = walker.nextNode(); t; t = walker.nextNode()) {
    if (t.textContent.trim() && t.parentElement && !seen.has(t.parentElement)) {
      seen.add(t.parentElement);
      targets.push(t.parentElement);
    }
  }
  root.querySelectorAll('input:not([type=checkbox]):not([type=radio]):not([type=hidden]), textarea').forEach((el) => { if (el.value) targets.push(el); });
  const bad = [];
  for (const el of targets) {
    if (!el.getClientRects().length || el.closest('svg, [hidden], [aria-hidden="true"]')) continue;
    const cs = w.getComputedStyle(el);
    if (cs.visibility !== 'visible' || Number(cs.opacity) === 0) continue;
    const { under, fade } = backgrounds(el);
    const fg = rgba(cs.color);
    fg.a *= fade;
    const worst = Math.min(...under.map((bg) => ratio(over(fg, bg), bg)));
    if (worst < MIN_RATIO) {
      const label = `${el.parentElement.className || el.parentElement.tagName.toLowerCase()} > ${el.tagName.toLowerCase()}${el.className ? `.${String(el.className).trim().replace(/\s+/g, '.')}` : ''}`;
      bad.push(`${where}：${label}「${(el.value || el.textContent).trim().slice(0, 14)}」${worst.toFixed(2)}（${hex(over(fg, under[0]))} / ${hex(under[0])}）`);
    }
  }
  return bad;
}

const PAGES = [
  ['main', 'today'], ['main', 'records/weight'], ['main', 'records/bp'], ['main', 'records/glucose'], ['main', 'records/meds'],
  ['main', 'checkups/schedule'], ['main', 'checkups/ultrasound'], ['main', 'tools'], ['main', 'tools/food'], ['main', 'tools/weeks'],
  ['late', 'today'], ['late', 'tools/kicks'], ['late', 'tools/bag'], ['bag-done', 'tools/bag'], ['checkup-day', 'today'],
  ['labor', 'today'], ['labor', 'tools/kicks'], ['labor', 'tools/contractions'], ['fresh', 'today'], ['empty', ''],
  ['main', 'journal'], ['fresh', 'journal'],
  ['main', 'tools/recipes'], ['main', 'tools/recipes/all'], ['main', 'tools/recipes/shop'],
  ['baby', 'today'], ['baby', 'baby'], ['baby', 'baby/growth'], ['baby', 'baby/health'], ['baby-7m', 'baby/vaccines'],
  ['baby-7m', 'baby/food'], ['baby', 'baby/food'], ['baby', 'records/weight'], ['baby', 'tools'],
];
const SHEETS = [
  ['main', 'today', '[data-action="open-settings"]'],
  ['main', 'journal', '[data-action="edit-journal"]'],
  ['main', 'records/meds', '[data-action="add-med"]'],
  ['main', 'checkups/schedule', '[data-action="add-checkup"]'],
  ['main', 'checkups/ultrasound', '[data-action="add-us"]', '检查日期：2026-10-09\n双顶径约6.2cm 股骨长约4.5cm\n胎盘位于后壁，成熟度Ⅰ级'],
  ['main', 'tools/recipes', '#dish-lunch-main'],
  ['main', 'tools/recipes/all', '#dish-liver-spinach'],
  ['baby', 'baby', '#log-bottle'],
  ['baby', 'baby/growth', '[data-action="baby-birth-open"]'],
  ['baby-7m', 'baby/food', '#food-liver-puree'],
  ['baby-7m', 'baby/vaccines', '#vx-open-mpsva-1'],
];

(async () => {
  try {
    log(true, DARK ? '深色模式' : '浅色模式');
    let bad = [];
    for (const [scene, route] of PAGES) {
      await open(scene, route);
      await wait(150);
      bad = bad.concat(audit(d.getElementById('app'), `${scene} #/${route}`));
    }
    for (const [scene, route, button, paste] of SHEETS) {
      await open(scene, route);
      d.querySelector(button).click();
      if (paste) {
        const t = d.getElementById('us-paste');
        t.value = paste;
        t.dispatchEvent(new w.InputEvent('input', { bubbles: true }));
      }
      await wait(600);
      bad = bad.concat(audit(d.querySelector('dialog[open]'), `${scene} #/${route} ${button}`));
    }
    await open('main', 'records/bp');
    d.getElementById('bp-sys').value = '30';
    d.getElementById('bp-sys').form.requestSubmit();
    await wait(100);
    const error = d.querySelector('.form-error:not([hidden])');
    log(Boolean(error), '查到了表单出错的提示');
    if (error) bad = bad.concat(audit(error.parentElement, '血压表单出错'));
    await open('main', 'today');
    d.querySelector('[data-action="snooze-backup"]').click();
    await wait(600);
    bad = bad.concat(audit(d.getElementById('toast'), '提示条'));
    d.querySelector('.quick-form .btn').click();
    await wait(600);
    log(Boolean(d.querySelector('#toast .toast-oops')), '查到了出错的提示条');
    bad = bad.concat(audit(d.getElementById('toast'), '出错的提示条'));
    await open('main', 'journal');
    d.querySelector('.mood-opt.mood-calm').click();
    await wait(400);
    bad = bad.concat(audit(d.getElementById('app'), '选好心情的心情页'));
    d.querySelector('form[data-form="journal"]').requestSubmit();
    await wait(600);
    log(Boolean(d.querySelector('#toast [data-action="undo"]')), '查到了带撤销的提示条');
    bad = bad.concat(audit(d.getElementById('toast'), '带撤销的提示条'));

    // 睡前故事：晚上首页的卡片；故事页摆成读过、有收藏、有隐藏、朗读停在第二段的样子
    const evening = new Date(2026, 9, 12, 21, 0).getTime();
    await open('main', 'today');
    w.Date.now = () => evening;
    w.Baby.app.render();
    log(Boolean(d.querySelector('.panel-story .story-bird')), '查到了晚上的故事卡片');
    bad = bad.concat(audit(d.getElementById('app'), '晚上的首页'));
    await open('main', 'tools/story');
    w.Date.now = () => evening;
    const { app, stories: St, storyIndex } = w.Baby;
    const st = app.state.stories;
    St.select(storyIndex, st, TODAY, 'prose-07');
    St.markRead(st, TODAY, 'prose-07');
    st.favorites = ['prose-01'];
    st.blocked = ['aesop-02', 'andersen'];
    app.ui.storyShelf = true;
    app.render();
    for (let i = 0; i < 100 && !d.querySelector('.story-sub'); i += 1) await wait(30);
    app.ui.reading = { id: 'prose-07', index: 1, total: d.querySelectorAll('.story-p').length, playing: false };
    app.render();
    log(Boolean(d.querySelector('.story-p.is-reading') && d.querySelector('.story-player') && d.querySelector('.shelf-row.is-hidden')), '查到了故事页的正文、朗读条和目录');
    bad = bad.concat(audit(d.getElementById('app'), '故事页'));

    // 孕期食谱：有收藏、有忌口、忌口展开着；买菜清单勾了一半
    await open('main', 'tools/recipes');
    const kitchen = w.Baby.app;
    const meals = kitchen.state.meals;
    meals.favorites = [d.querySelector('#dish-breakfast').dataset.id];
    meals.avoid = ['seafood', 'spicy'];
    kitchen.ui.avoidOpen = true;
    kitchen.render();
    log(Boolean(d.querySelector('.dish-fav[aria-pressed="true"]') && d.querySelector('#recipe-avoid[open]')), '查到了收藏和忌口');
    bad = bad.concat(audit(d.getElementById('app'), '有收藏和忌口的菜单'));
    w.location.hash = '#/tools/recipes/shop';
    for (let i = 0; i < 100 && !d.querySelector('.recipe-shop'); i += 1) await wait(30);
    meals.bought[TODAY] = [...d.querySelectorAll('.recipe-shop input[type="checkbox"]')].filter((_, i) => i % 2 === 0).map((box) => box.dataset.name);
    kitchen.render();
    log(Boolean(d.querySelector('.recipe-shop .bag-item.is-done')), '查到了勾过的买菜清单');
    bad = bad.concat(audit(d.getElementById('app'), '勾过一半的买菜清单'));

    // 宝宝：正在喂奶、正在睡觉，换过尿布有提醒的记录；换到别的页面挂着计时条
    await open('baby', 'baby');
    d.getElementById('breast-left').click();
    d.getElementById('sleep-toggle').click();
    await wait(200);
    log(Boolean(d.querySelector('.qt.is-live') && d.querySelector('.qt.is-sleep')), '查到了正在计时的喂奶和睡觉');
    bad = bad.concat(audit(d.getElementById('app'), '正在计时的宝宝页'));
    w.location.hash = '#/records/weight';
    for (let i = 0; i < 100 && !d.querySelector('.live-sleep'); i += 1) await wait(30);
    bad = bad.concat(audit(d.querySelector('.live-bar'), '宝宝的计时条'));
    for (const line of [...new Set(bad)]) log(false, line);
    log(bad.length === 0, `文字对比度都不低于 ${MIN_RATIO}:1`);
  } catch (err) {
    log(false, `出错：${err.message}`);
  }
  document.getElementById('out').textContent = `DONE\n${out.join('\n')}`;
})();
</script>
