<!doctype html><meta charset="utf-8"><body><pre id="out">RUNNING</pre>
<script src="guard.js"></script>
<script>
localStorage.clear();
const out = [];
const log = (ok, name, extra = '') => out.push(`${ok ? 'PASS' : 'FAIL'} ${name}${extra && !ok ? ` — ${extra}` : ''}`);
const iframe = document.createElement('iframe');
iframe.style.cssText = 'width:390px;height:844px';
iframe.src = '../../index.html?noidb&today=2026-10-12';
document.body.appendChild(iframe);

let w, d;
const errors = [];
const blobs = [];
// 冒不冒爱心看系统的「减弱动态效果」，测试里自己定，不跟着跑测试的机器走
let reduceMotion = false;
function bind() {
  w = iframe.contentWindow;
  d = iframe.contentDocument;
  w.addEventListener('error', (e) => errors.push(e.message));
  w.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
  const realMatch = w.matchMedia.bind(w);
  w.matchMedia = (q) => (q.includes('reduced-motion') ? { matches: reduceMotion, media: q } : realMatch(q));
  w.confirm = () => true;
  w.URL.createObjectURL = (b) => { blobs.push(b); return 'blob:fake'; };
  w.URL.revokeObjectURL = () => {};
  const clickLink = w.HTMLAnchorElement.prototype.click;
  w.HTMLAnchorElement.prototype.click = function () {
    if (!this.hasAttribute('download')) clickLink.call(this);
  };
}
const $ = (s) => d.querySelector(s);
const $$ = (s) => [...d.querySelectorAll(s)];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const nav = async (hash) => {
  await wait(40);
  if (w.location.hash === hash) return;
  await new Promise((r) => { w.addEventListener('hashchange', () => r(), { once: true }); w.location.hash = hash; });
};
const state = () => JSON.parse(w.localStorage.getItem('honey-pot:v1'));
const toastText = () => d.getElementById('toast').textContent.replace(/\s+/g, ' ').trim();
const reload = () => new Promise((r) => { iframe.onload = r; w.location.reload(); }).then(bind);
const composer = () => $('dialog[open] form[data-form="journal-day"]');
const sheet = () => d.getElementById('sheet-dialog');
const openDay = (date = '2026-10-12') => $(`.mcal-cell[data-date="${date}"]`).click();
const pick = (root, mood) => root.querySelector(`.mood-opt.mood-${mood}`).click();
const checked = (root) => (root.querySelector('input[name="mood"]:checked') || {}).value || '';
const bursts = () => d.querySelectorAll('.burst').length;

iframe.onload = async () => {
  bind();
  try {
    const f = $('form[data-form="onboard"]');
    f.elements.dueDate.value = '2027-01-29';
    f.elements.nickname.value = '豆豆';
    f.requestSubmit();
    await wait(10);
    log(/准备好啦，和豆豆一起慢慢记/.test(toastText()) && $('#toast .toast-cheer .toast-bee svg'), '开始用时小蜜蜂提示条带上宝宝小名', toastText());
    log(bursts() === 1 && $$('.burst i').length === 9, '开始用时冒爱心和蜂蜜');
    log($$('.tabbar .tab').length === 5 && $('.tab[href="#/journal"]').textContent.includes('心情'), '底栏第 5 个是「心情」');

    log(/今天心情怎么样/.test($('.panel-today').textContent) && $$('.mood-quick-btn').length === 6, '首页有一排心情小脸');
    $('.mood-quick-btn[data-mood="tired"]').click();
    await wait(40);
    log(w.location.hash === '#/journal' && $('.tab[aria-current="page"]').getAttribute('href') === '#/journal', '点小脸进到心情页');
    log(checked(composer()) === 'tired' && d.activeElement === composer().elements.text, '选好了这个心情，光标在写字的框里', `${checked(composer())} ${d.activeElement && d.activeElement.id}`);
    log($('.card-mood-tl .empty-bee'), '还没记过时显示空的时间线');

    pick(composer(), 'happy');
    composer().querySelectorAll('input[name="mood"]').forEach((r) => { r.checked = false; });
    composer().requestSubmit();
    log(/先选一个心情吧/.test(composer().querySelector('.form-error').textContent) && state().journal.length === 0, '没选心情时不让记');

    pick(composer(), 'happy');
    composer().elements.text.value = '今天去散步了\n\n\n\n看到晚霞';
    w.Baby.app.render();
    log(checked(composer()) === 'happy' && composer().elements.text.value.startsWith('今天去散步了'), '重绘后选好的心情和写了一半的字都还在');
    composer().requestSubmit();
    await wait(10);
    let j = state().journal;
    log(j.length === 1 && j[0].mood === 'happy' && j[0].text === '今天去散步了\n\n看到晚霞' && /^\d\d:\d\d$/.test(j[0].time) && j[0].date === '2026-10-12', '记下一条，带上几点', JSON.stringify(j[0]));
    log(/记下了，豆豆也跟着开心/.test(toastText()) && $('#toast [data-action="undo"]'), '提示按心情说话，带撤销', toastText());
    log(bursts() >= 1, '记下时冒爱心');
    $('[data-action="mood-stats"]').click();
    log($('#mood-stats .mood-stats-total').textContent === '一共记了 1 条', '弹窗显示全部记录总数');
    sheet().querySelector('[data-action="close-dialog"]').click();
    await wait(40);
    log($('.mood-entry.mood-happy') && $('.mood-day-rel').textContent === '今天' && /孕 24⁺³ 周/.test($('.mood-day-date').textContent), '时间线上出现今天这条，带孕周');
    log($('.mood-entry-text').textContent === '今天去散步了\n\n看到晚霞', '换行保留下来');

    $('[data-action="undo"]').click();
    log(state().journal.length === 0 && /已撤销/.test(toastText()), '撤销刚记的');

    openDay();
    pick(composer(), 'happy');
    composer().requestSubmit();
    log(/开心的日子记下来了/.test(toastText()), '同样的事第二次换个说法', toastText());
    log(!$('.mood-entry-text'), '只选心情不写字也能记');

    log(!$('.mcal-cell[data-date="2026-10-13"]'), '以后的日期没有记录入口');
    openDay('2026-10-10');
    pick(composer(), 'low');
    composer().elements.text.value = '<img src=x onerror="window.hacked=1">腰酸';
    composer().requestSubmit();
    j = state().journal;
    log(j.length === 2 && j[1].date === '2026-10-10' && j[1].time === '', '补记以前的日子，不带几点', JSON.stringify(j[1]));
    log($$('.mood-day').length === 2 && $$('.mood-day-num')[0].textContent === '10' && /10月/.test($$('.mood-day')[1].textContent), '按天分组，以前的显示几号几月');
    log(!$('.mood-entry-text img') && $$('.mood-entry-text')[0].textContent.startsWith('<img') && !w.hacked, '写的字原样显示，不当成网页代码');
    log(!$('.mood-month') && $('.mcal-total-toggle b').textContent === '2', '月份总数显示在月历，时间线不重复标题');

    const todayEntry = w.Baby.app.state.journal[0];
    todayEntry.text = '今天听到胎心了，想把这个瞬间记下来。\n' + '真开心'.repeat(8);
    await nav('#/');
    const latestMood = $('.todo-icon-mood').parentElement;
    log(latestMood.querySelector('time').textContent === todayEntry.time && latestMood.querySelector('.todo-mood-note').textContent === todayEntry.text, '首页显示今天最新心情的时间与完整正文');
    log(/今天的心情：开心/.test($('.panel-today').textContent) && $('.todo-icon-mood svg') && $('.panel-today a[href="#/journal"]'), '首页显示今天的心情，可以再写一条');

    $('.panel-today [data-action="journal-start"]').click();
    await wait(40);
    log(sheet().open && composer() && checked(composer()) === '' && composer().elements.text.value === '', '再写一条打开今天的空白表单');
    sheet().querySelector('[data-action="close-dialog"]').click();
    await wait(40);
    const low = state().journal.find((e) => e.mood === 'low');
    $(`[data-action="edit-journal"][data-id="${low.id}"]`).click();
    log(sheet().open && checked(sheet()) === 'low' && sheet().querySelector('textarea').value.endsWith('腰酸'), '点铅笔打开这条，内容都填好了');
    pick(sheet(), 'calm');
    sheet().querySelector('textarea').value = '腰酸，睡前泡了脚';
    sheet().querySelector('input[name="date"]').value = '2026-10-20';
    sheet().querySelector('form').requestSubmit();
    log(sheet().open && /日期不能晚于今天/.test(sheet().querySelector('.form-error').textContent), '改到以后的日子：提示，不保存');
    sheet().querySelector('input[name="date"]').value = '2026-10-12';
    sheet().querySelector('form').requestSubmit();
    j = state().journal;
    const edited = j.find((e) => e.id === low.id);
    log(!sheet().open && edited.mood === 'calm' && edited.date === '2026-10-12' && edited.text === '腰酸，睡前泡了脚' && /保存好了/.test(toastText()), '改好后保存', toastText());
    log($$('.mood-day').length === 1 && j[j.length - 1].id === low.id, '改到今天后排进今天，没时间的排后面');

    $(`[data-action="edit-journal"][data-id="${low.id}"]`).click();
    sheet().querySelector('[data-action="delete-journal"]').click();
    log(!sheet().open && state().journal.length === 1 && /删掉了这条心情/.test(toastText()), '删掉一条');
    const undoBtn = d.querySelector('#toast [data-action="undo"]');
    undoBtn.focus();
    await wait(6500);
    log(d.getElementById('toast').classList.contains('show') && w.Baby.app.ui.undo, '键盘焦点在「撤销」上时，提示条先不收起');
    undoBtn.blur();
    await wait(1000);
    log(d.getElementById('toast').classList.contains('show') && w.Baby.app.ui.undo, '焦点离开后再留一会儿');
    $('[data-action="undo"]').click();
    log(state().journal.length === 2 && state().journal[1].id === low.id, '撤销删除，回到原来的位置');

    const s = state();
    const moods = ['happy', 'calm', 'excited', 'tired', 'low', 'anxious'];
    for (let i = 0; i < 45; i += 1) {
      s.journal.push({ id: `j-old-${i}`, date: w.Baby.dates.addDays('2026-10-01', -i), time: '20:00', mood: moods[i % 6], text: `第 ${i} 天` });
    }
    w.localStorage.setItem('honey-pot:v1', JSON.stringify(s));
    await reload();
    await nav('#/journal');
    $('[data-action="mood-stats"]').click();
    log($('#mood-stats .mood-stats-total').textContent === '一共记了 47 条', '弹窗显示全部记录总数');
    sheet().querySelector('[data-action="close-dialog"]').click();
    await wait(40);
    log($$('.card-mood-tl .mood-entry').length === 3 && !$('#mcal-tally').hidden, '十月只显示三条，分类默认展开');
    $('.mcal-total-toggle').click();
    log($('#mcal-tally').hidden && $('.mcal-total-toggle b').textContent === '3', '收起分类后保留当月总数');
    $('.mcal-total-toggle').click();
    log(!$('#mcal-tally').hidden, '再次点击展开分类');
    $('.mcal [data-step="-1"]').click();
    const savedWidth = iframe.style.width;
    const summaryBox = () => $('.mcal-summary').getBoundingClientRect();
    const statsBox = () => $('.mcal-stats-toggle').getBoundingClientRect();
    const countItems = () => [$('.mcal-total-toggle'), ...$$('#mcal-tally li')];
    const besideIcons = () => countItems().every((item) => item.querySelector('b').getBoundingClientRect().left >= item.querySelector('svg').getBoundingClientRect().right);
    iframe.style.width = '320px';
    w.dispatchEvent(new w.Event('resize'));
    log(statsBox().top >= summaryBox().bottom && Math.abs(statsBox().right - $('.mcal-foot').getBoundingClientRect().right) < 1, '窄屏分类放不下时统计按钮另起一行靠右');
    log(countItems().every((item) => item.querySelector('b').getBoundingClientRect().top >= item.querySelector('svg').getBoundingClientRect().bottom), '横排放不下时合计与各类数字移到图标下面');
    $('.mcal-total-toggle').click();
    log($('.mcal-total-toggle b').getBoundingClientRect().left >= $('.mcal-total-toggle svg').getBoundingClientRect().right, '同样宽度下收起分类后总数回到横排');
    $('.mcal-total-toggle').click();
    iframe.style.width = '540px';
    w.dispatchEvent(new w.Event('resize'));
    log(besideIcons() && statsBox().top < summaryBox().bottom && statsBox().left >= summaryBox().right, '宽屏数字放在图标右侧，与统计按钮同排');
    iframe.style.width = savedWidth;
    log($$('.card-mood-tl .mood-entry').length === 20 && /还有 10 条/.test($('[data-action="journal-more"]').textContent) && $('.mcal-total-toggle b').textContent === '30', '翻到九月后分页和总数都只算九月');
    $('[data-action="journal-more"]').click();
    log($$('.card-mood-tl .mood-entry').length === 30 && !$('[data-action="journal-more"]'), '展开更多只看本月');
    $('.mcal [data-step="1"]').click();

    $('[data-action="open-settings"]').click();
    d.getElementById('settings-dialog').querySelector('[data-action="export-backup"]').click();
    await wait(10);
    const backup = JSON.parse(textOf(blobs[blobs.length - 1]));
    log(Array.isArray(backup.journal) && backup.journal.length === 47, '备份里包含心情日记');
    d.getElementById('settings-dialog').querySelector('[data-action="close-dialog"]').click();

    await nav('#/');
    $('.quick-form .btn').click();
    log($('#toast .toast-oops') && /先填一下体重/.test(toastText()), '出错时换成担心的小蜜蜂');

    reduceMotion = true;
    d.querySelectorAll('.burst').forEach((b) => b.remove());
    await nav('#/journal');
    openDay();
    pick(composer(), 'calm');
    composer().requestSubmit();
    await wait(10);
    log(state().journal.length === 48 && bursts() === 0, '系统设置了减弱动态效果时不冒爱心');
    reduceMotion = false;

    // ---- 最近心情不太好时，关心一下 ----
    const J = w.Baby.journal;
    for (let i = 1; i <= 5; i += 1) J.add(w.Baby.app.state, { date: w.Baby.dates.addDays('2026-10-12', -i), mood: i % 2 ? 'low' : 'anxious', text: '' }, '2026-10-12', Date.now());
    w.Baby.app.render();
    const care = () => ($('.mood-care') || {}).textContent || '';
    log(/最近两周有 5 天心情低落或焦虑/.test(care()) && /孕期情绪起伏很常见/.test(care()) && $('.mood-care a[href="tel:12356"]') && /120/.test(care()), '两周里有 5 天低落或焦虑：心情页顶上关心一下，给出 12356 和 120', care());
    await nav('#/');
    log(/最近心情不太好的日子有点多/.test($('.panel-today').textContent) && $('.panel-today a[href="tel:12356"]'), '首页「今天该记」也提一句');
    await nav('#/journal');
    $('[data-action="mood-care-hide"]').click();
    await wait(20);
    log(!$('.mood-care') && state().prefs.moodCareHidden === '2026-10-12' && /过几天/.test(toastText()), '点「过几天再说」就收起来，7 天内不再出现');

    // ---- 心情月历 ----
    const cal = () => $('.mcal');
    const cell = (date) => $(`.mcal-cell[data-date="${date}"]`);
    const title = () => cal().querySelector('.day-title').textContent.replace(/\s+/g, ' ');
    const statsToggle = () => $('.mcal [data-action="mood-stats"]');
    log(statsToggle().textContent === '统计' && statsToggle().getAttribute('aria-haspopup') === 'dialog' && !$('.mcal .mood-stats-total'), '月历仅显示统计入口');
    statsToggle().click();
    const stats = $('#sheet-dialog .mood-stage-counts');
    log(d.activeElement === sheet().querySelector('h2') && d.activeElement.textContent === '阶段统计',
      '统计弹窗打开时聚焦标题，关闭按钮不自动获得焦点');
    log(sheet().open && stats.tBodies[0].querySelector('td.st-mid')
      && w.getComputedStyle(stats.tBodies[0].querySelector('td.st-mid')).backgroundColor === w.getComputedStyle($('.mcal-cell.st-mid')).backgroundColor, '展开统计，孕中期一行沿用月历格子的底色');
    log($('.mood-total-icon svg').isEqualNode($('.tab[href="#/journal"] svg')), '合计使用心情页标签图标');
    const originalWidth = iframe.style.width;
    for (const width of [320, 517, 760]) {
      iframe.style.width = width + 'px';
      const totalCell = stats.tBodies[0].rows[0].cells[0];
      const compact = $('#mood-stats').getBoundingClientRect().width <= 280;
      log((w.getComputedStyle(totalCell.querySelector('.mood-stage-name')).display === 'none') === compact
        && (w.getComputedStyle(totalCell.querySelector('.mood-count-unit')).display === 'none') === compact
        && (!compact || (w.getComputedStyle(totalCell.querySelector('small')).fontWeight === '700' && totalCell.getAttribute('aria-label').includes('早期'))),
        width + 'px 宽时合计格按空间显示阶段名或加粗总数');
      const boxes = [...stats.tBodies[0].querySelectorAll('th, td')].map((el) => el.getBoundingClientRect());
      log(boxes.every((box) => box.width > 0 && Math.abs(box.width - box.height) < 1), width + 'px 宽时，阶段和数量格均为正方形');
    }
    iframe.style.width = originalWidth;
    const midRow = [...stats.tBodies[0].rows].find((row) => row.cells[0].firstChild.textContent === '中期');
    log(!$('.mcal-legend') && !stats.caption && stats.tHead.rows[0].cells[0].textContent === '合计' && [...stats.tBodies[0].rows].map((row) => row.cells[0].firstChild.textContent).join() === '早期,中期,晚期,产后' && midRow.cells[0].querySelector('small').textContent === `${state().journal.length} 条`, '月历移除颜色图例，阶段卡统计全部月份的记录');
    log([...midRow.cells].slice(1).every((cell, i) => Number(cell.textContent) === state().journal.filter((e) => e.mood === moods[i]).length), '阶段表按六种心情分别计数');
    sheet().querySelector('[data-action="close-dialog"]').click();
    await wait(40);
    const swipe = async (dx, dy, pointerType = 'touch', verticalStart = false) => {
      const target = cal().querySelector('.day-title');
      const grid = cal().querySelector('.mcal-grid');
      const send = (type, x, y) => target.dispatchEvent(new w.PointerEvent(type, {
        bubbles: true, isPrimary: true, pointerId: 1, pointerType, clientX: x, clientY: y, button: 0,
      }));
      const touch = (type, x, y) => {
        const point = new w.Touch({ identifier: 1, target, clientX: x, clientY: y });
        return target.dispatchEvent(new w.TouchEvent(type, { bubbles: true, cancelable: true,
          touches: type === 'touchend' ? [] : [point], changedTouches: [point] }));
      };
      if (pointerType === 'touch') {
        touch('touchstart', 180, 100);
        const nativeScroll = touch('touchmove', 180 + (verticalStart ? 2 : 12), 100 + (verticalStart ? 12 : 9));
        log(nativeScroll === verticalStart, '起手主要向上或向下才放行原生滚动');
        const stillNative = touch('touchmove', 180 + dx, 100 + dy);
        log(stillNative === verticalStart, '方向确定后保持锁定');
      } else {
        send('pointerdown', 180, 100);
        send('pointermove', 180 + dx, 100 + dy);
      }
      const followed = Boolean(grid.style.transform);
      if (pointerType === 'touch') touch('touchend', 180 + dx, 100 + dy);
      else send('pointerup', 180 + dx, 100 + dy);
      const animations = grid.getAnimations();
      animations.forEach((animation) => animation.finish());
      await wait(50);
      return followed && animations.length > 0;
    };
    await swipe(5, 100, 'touch', true);
    log(cal().dataset.month === '2026-10', '竖滑不切月');
    await swipe(90, 115);
    log(cal().dataset.month === '2026-09' && $('.mcal-total-toggle b').textContent === '30', '触屏右滑到上个月并更新时间线数据');
    log(await swipe(-25, 1, 'mouse') && cal().dataset.month === '2026-09', '鼠标短拖跟手移动后回弹');
    log(await swipe(-90, 5, 'mouse') && cal().dataset.month === '2026-10' && !sheet().open, '鼠标左拖滑入下个月');
    log(/2026 年 10 月/.test(title()) && $$('.mcal-week').length === 7 && $$('.mcal-cell.is-blank').length === 3 && $$('.mcal-cell[data-date]').filter((el) => el.dataset.date <= '2026-10-12').length === 12 && $$('.mcal-cell.is-future').length + $$('.mcal-cell[data-date]').filter((el) => el.dataset.date > '2026-10-12' && el.querySelector('.mcal-heart')).length === 19,
      '10 月：一周从周一开始，1 号是周四；未来只有产检日可点', `${$$('.mcal-cell[data-date]').length}/${$$('.mcal-cell.is-future').length}`);
    const todays = J.onDay(state().journal, '2026-10-12');
    log(cell('2026-10-12').classList.contains(`mood-${todays[0].mood}`) && cell('2026-10-12').querySelector('.mood-face svg') && cell('2026-10-12').querySelector('.mcal-count').textContent === String(todays.length) && cell('2026-10-12').classList.contains('is-today'),
      '今天那格放最新那条的小脸，标出记了几条', `${todays[0].mood} ${todays.length} ${cell('2026-10-12').className}`);
    log(cell('2026-10-03').querySelector('.mcal-num').textContent === '3' && !cell('2026-10-03').querySelector('.mood-face') && cell('2026-10-03').classList.contains('st-mid'), '没记的那天只写几号，底色是孕中期');
    log(/已经连着记了 6 天/.test(title()), '说一声连着记了几天', title());

    cell('2026-10-03').click();
    log(sheet().open && /10月3日/.test(sheet().querySelector('h2').textContent) && /孕中期 · 孕 23⁺¹ 周/.test(sheet().textContent) && sheet().querySelector('.mood-day-none') && /补记一条/.test(sheet().textContent),
      '点没记的一天：说还没记，可以补记', sheet().textContent.replace(/\s+/g, ' ').slice(0, 80));
    log(composer().elements.text.placeholder === '想说点什么？写给自己，也可以写给宝宝（不写也行）', '补记输入框显示完整提示');
    sheet().querySelector('form').requestSubmit();
    log(sheet().open && /先选一个心情吧/.test(sheet().querySelector('.form-error').textContent), '没选心情时不让记');
    pick(sheet(), 'calm');
    sheet().querySelector('textarea').value = '补上那天去公园';
    sheet().querySelector('form').requestSubmit();
    await wait(10);
    const added = state().journal.find((e) => e.date === '2026-10-03');
    log(!sheet().open && added && added.mood === 'calm' && added.time === '' && added.text === '补上那天去公园', '补记一条，不带几点', JSON.stringify(added));
    log(cell('2026-10-03').classList.contains('mood-calm') && cell('2026-10-03').classList.contains('is-pop') && $('#toast [data-action="undo"]'), '那一格换成小脸跳一下，可以撤销');

    const model = w.Baby.model;
    const app = w.Baby.app;
    const booking = model.addCheckup(app.state, { date: '2026-10-12', title: '复查 <A>' });
    model.addCheckup(app.state, { date: '2026-10-12', title: '复查 B' });
    app.render();
    log(cell('2026-10-12').querySelector('.mcal-count') && cell('2026-10-12').querySelector('.mcal-heart'), '同日多条心情和产检分别显示角标');
    cell('2026-10-12').click();
    const notice = sheet().querySelector('.mood-checkups');
    log(cell('2026-10-12').querySelector('.mcal-heart').isEqualNode(notice.firstElementChild) && w.getComputedStyle(notice).borderTopStyle === 'dashed', '产检提示框用虚线边框和月历同款红心');
    log(sheet().querySelector('.dialog-head + .mood-checkups').textContent.includes('复查 <A>、复查 B') && !sheet().querySelector('.mood-checkups a'), '弹窗开头展示同日全部产检标题');
    log(sheet().open && /今天/.test(sheet().querySelector('h2').textContent) && sheet().querySelectorAll('.mood-entry').length === todays.length && /再记一条/.test(sheet().textContent), '点今天：列出今天记的几条，下面可以再记一条');
    pick(sheet(), 'happy');
    sheet().querySelector('form').requestSubmit();
    await wait(10);
    const again = J.onDay(state().journal, '2026-10-12');
    log(again.length === todays.length + 1 && /^\d\d:\d\d$/.test(again.find((e) => !todays.some((t) => t.id === e.id)).time) && cell('2026-10-12').querySelector('.mcal-count').textContent === String(again.length), '今天再记一条带上几点，格子上的条数也跟着变');
    cell('2026-10-12').click();
    sheet().querySelector('[data-action="edit-journal"]').click();
    log(sheet().open && sheet().querySelector('form[data-form="journal-edit"]'), '在那天的列表里点铅笔改一条');
    sheet().querySelector('[data-action="close-dialog"]').click();
    await wait(20);

    const next = () => cal().querySelector('[data-step="1"]');
    const prev = () => cal().querySelector('[data-step="-1"]');
    model.updateCheckup(app.state, booking.id, { date: '2026-11-02' });
    next().click();
    cell('2026-11-02').click();
    log(sheet().querySelector('.mood-checkups').textContent.includes('复查 <A>') && !composer(), '改约后能跨月查看未来产检，不能提前记录心情');
    sheet().querySelector('[data-action="close-dialog"]').click();
    await wait(20);
    prev().click();
    prev().click();
    log(/2026 年 9 月/.test(title()) && /这个月记了 30 天/.test(title()) && cell('2026-09-15').querySelector('.mood-face') && !next().disabled, '翻到 9 月，说这个月记了几天', title());
    for (let i = 0; i < 6; i += 1) prev().click();
    log(/2026 年 4 月/.test(title()) && prev().disabled && cell('2026-04-23').classList.contains('st-pre') && cell('2026-04-24').classList.contains('st-early'),
      '最早翻到怀孕那个月，末次月经以前算孕前', title());
    while (cal().dataset.month < '2026-09') next().click();
    openDay('2026-09-05');
    pick(composer(), 'excited');
    composer().requestSubmit();
    await wait(10);
    log(/2026 年 9 月/.test(title()) && cell('2026-09-05').classList.contains('is-pop'), '在九月补记后，仍显示九月并标出所选日期', title());
    next().click();
    log(/2026 年 10 月/.test(title()) && !next().disabled, '翻回这个月');

    for (const date of ['2026-04-23', '2026-04-24']) {
      J.add(w.Baby.app.state, { date, mood: 'calm', text: '' }, '2026-10-12', Date.now());
    }
    w.Baby.app.render();
    statsToggle().click();
    const rows = [...$('.mood-stage-counts').tBodies[0].rows];
    log(rows[0].cells[0].textContent.includes('孕前') && rows[1].cells[0].firstChild.textContent === '早期'
      && rows[0].cells[2].textContent === '1' && rows[1].cells[2].textContent === '1', '跨阶段的两条平静记录各归到对应阶段');
    sheet().querySelector('[data-action="close-dialog"]').click();
    log(!sheet().open, '关闭统计回到月历');
  } catch (e) {
    log(false, '脚本异常', `${e.message}\n${e.stack}`);
  }
  log(errors.length === 0, '页面没有报错', errors.join(' | '));
  document.getElementById('out').textContent = `DONE\n${out.join('\n')}`;
};
</script>
</body>
