<!doctype html><meta charset="utf-8"><body><pre id="out">RUNNING</pre>
<script>
localStorage.clear();
const out = [];
const log = (ok, name, extra = '') => {
  out.push(`${ok ? 'PASS' : 'FAIL'} ${name}${extra && !ok ? ` — ${extra}` : ''}`);
  console.log(`STEP ${out[out.length - 1]}`);
};
const iframe = document.createElement('iframe');
iframe.style.cssText = 'width:420px;height:860px';
iframe.src = '../../index.html?today=2026-10-16';
document.body.appendChild(iframe);

const EVENING = new Date(2026, 9, 16, 21, 0, 0).getTime();
const MORNING = new Date(2026, 9, 16, 10, 0, 0).getTime();
let fakeNow = EVENING;
let w, d;
const errors = [];
const locks = [];
const held = () => locks.filter((l) => !l.released).length;

// 假的朗读：记下每句读了什么，endOne() 当作这一句读完
const VOICES = [
  { name: 'Meijia', lang: 'zh-TW', localService: true },
  { name: 'Tingting', lang: 'zh-CN', localService: true, voiceURI: 'com.apple.voice.compact.zh-CN.Tingting' },
  { name: 'Tingting', lang: 'zh-CN', localService: true, voiceURI: 'com.apple.voice.enhanced.zh-CN.Tingting' },
  { name: 'Zarvox', lang: 'en-US', localService: true },
  { name: 'Daniel', lang: 'en-GB', localService: true },
  { name: 'Samantha', lang: 'en-US', localService: true },
];
let spoken = [];
let current = null;
let cancels = 0;
const endOne = () => {
  const u = current;
  current = null;
  if (u && u.onend) u.onend();
};

function bind() {
  w = iframe.contentWindow;
  d = iframe.contentDocument;
  w.addEventListener('error', (e) => errors.push(e.message));
  w.confirm = () => true;
  w.alert = (m) => errors.push(`alert(${m})`);
  const real = w.Date.now.bind(w.Date);
  w.Date.now = () => (fakeNow == null ? real() : fakeNow);
  const wakeLock = {
    request: async () => {
      const lock = new w.EventTarget();
      lock.released = false;
      lock.release = async () => { lock.released = true; lock.dispatchEvent(new w.Event('release')); };
      locks.push(lock);
      return lock;
    },
  };
  Object.defineProperty(w.navigator, 'wakeLock', { value: wakeLock, configurable: true });
  const synth = w.speechSynthesis;
  synth.getVoices = () => VOICES;
  synth.speak = (u) => { spoken.push(u); current = u; };
  synth.cancel = () => { current = null; cancels += 1; };
  Object.defineProperty(synth, 'speaking', { get: () => Boolean(current), configurable: true });
  w.SpeechSynthesisUtterance = function (text) { this.text = text; };
}
const $ = (s) => d.querySelector(s);
const $$ = (s) => [...d.querySelectorAll(s)];
const text = (s) => ($(s) ? $(s).textContent.replace(/\s+/g, ' ').trim() : '');
const state = () => JSON.parse(w.localStorage.getItem('pregnancy-desk:v1'));
const toastText = () => d.getElementById('toast').textContent.replace(/\s+/g, ' ').trim();
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms = 4000) => {
  const t0 = Date.now();
  while (!fn()) {
    if (Date.now() - t0 > ms) return false;
    await wait(30);
  }
  return true;
};
const nav = async (hash) => {
  await wait(40);
  if (w.location.hash === hash) return;
  await new Promise((r) => { w.addEventListener('hashchange', () => r(), { once: true }); w.location.hash = hash; });
};
const click = (s) => $(s).click();
const reload = () => new Promise((r) => { iframe.onload = r; w.location.reload(); }).then(bind);
const title = () => text('.story-title');
const lastSaid = () => (spoken.length ? spoken[spoken.length - 1] : {});
const reading = () => $('.story-p.is-reading');
const loaded = () => until(() => $$('.story-p').length > 0);

iframe.onload = async () => {
  bind();
  try {
    const f = $('form[data-form="onboard"]');
    f.elements.dueDate.value = '2027-01-29';
    f.requestSubmit();

    // ---- 首页卡片、工具目录 ----
    await wait(40);
    log($('.panel-story[href="#/tools/story"]') && $('.story-card-title').textContent.trim(), '晚上首页有今晚的故事');
    log(/郑振铎/.test(text('.story-bird cite')) && text('.story-bird p').length > 5, '附上飞鸟集里的一句', text('.story-bird'));
    const cardTitle = text('.story-card-title');
    fakeNow = MORNING;
    await nav('#/tools');
    await nav('#/');
    log(!$('.panel-story'), '白天首页不显示');
    fakeNow = EVENING;
    await nav('#/tools');
    log(text('.tool[data-tool="story"]').includes(`今晚：${cardTitle}`), '工具目录里写着今晚读什么', text('.tool[data-tool="story"]'));

    // ---- 故事页 ----
    await nav('#/tools/story');
    log(await loaded(), '正文下载好了');
    log(title() === cardTitle && /约 \d+ 分钟/.test(text('.story-meta')), '和首页是同一篇', `${title()} / ${cardTitle}`);
    log(text('.page-title') === '睡前故事' && $('.story-source a[href^="https://"]'), '有标题和出处链接');
    log($('.story-text').getAttribute('lang') === ($('.story-title').getAttribute('lang')), '正文标了语言');

    // 换成一篇短的中文，读到底
    click('#story-shelf summary');
    await wait(30);
    log($('#story-shelf').open && $$('.shelf-group').length >= 8, '展开全部故事');
    click('[data-action="story-pick"][data-id="prose-01"]');
    log(title() === '匆匆' && /今晚读《匆匆》/.test(toastText()), '从目录里挑一篇', title());
    log(!$('#story-shelf').open, '挑完收起目录');
    log(await loaded(), '散文正文下载好了');
    const paras = $$('.story-p').map((p) => p.textContent);
    log(paras.length === 5 && paras[0].startsWith('燕子去了'), '《匆匆》5 段', paras.length);

    click('[data-action="story-play"]');
    log(spoken.length === 1 && paras[0].startsWith(lastSaid().text.slice(0, 10)), '点朗读，从第一段读起', lastSaid().text);
    log(lastSaid().voice && /enhanced/.test(lastSaid().voice.voiceURI) && lastSaid().lang === 'zh-CN' && lastSaid().rate === 0.9, '默认用普通话的增强版声音、适中语速', JSON.stringify(lastSaid().voice));
    log(reading() && reading().dataset.i === '0' && $('.story-player') && /正在朗读/.test(text('.story-player')), '第一段高亮，下面出现朗读条');
    await wait(0);
    log(held() === 1, '朗读时屏幕常亮', held());
    // 第一段读完
    while (current && reading().dataset.i === '0') endOne();
    await until(() => reading() && reading().dataset.i === '1');
    log(reading().dataset.i === '1' && text('.story-player-pos') === '2', '读完一段自动接下一段', text('.story-player-pos'));

    click('.story-player [data-action="story-pause"]');
    log(!current && /暂停了/.test(text('.story-player')) && $('.story-actions [data-action="story-play"]') && /继续/.test(text('.story-actions [data-action="story-play"]')), '暂停');
    await wait(0);
    log(held() === 0, '暂停时恢复自动锁屏', held());
    const before = spoken.length;
    click('.story-player [data-action="story-play"]');
    log(spoken.length === before + 1 && paras[1].startsWith(lastSaid().text.slice(0, 8)), '继续时从这一段开头读', lastSaid().text);

    click('.story-p[data-i="3"]');
    log(reading().dataset.i === '3' && paras[3].startsWith(lastSaid().text.slice(0, 8)), '朗读时点哪段从哪段读', lastSaid().text);

    click('[data-action="story-rate"][data-rate="0.75"]');
    log(state().stories.rate === 0.75 && lastSaid().rate === 0.75 && reading().dataset.i === '3', '改语速马上用上');
    const zhNames = $$('.story-voice[data-lang="zh"] option').map((o) => o.textContent);
    log(zhNames.join() === 'Tingting（增强） · 普通话,Tingting · 普通话,Meijia · 台湾口音', '中文声音：增强版、普通话排前面，同名的分得清', zhNames.join());
    const enVoices = $$('.story-voice[data-lang="en"] option').map((o) => o.value);
    log(enVoices.length === 2 && !enVoices.includes('Zarvox'), '英文声音去掉搞怪的', enVoices.join());
    const pickVoice = (value) => {
      const sel = $('.story-voice[data-lang="zh"]');
      sel.value = value;
      sel.dispatchEvent(new w.Event('change', { bubbles: true }));
    };
    pickVoice('com.apple.voice.compact.zh-CN.Tingting');
    log(lastSaid().voice.voiceURI === 'com.apple.voice.compact.zh-CN.Tingting' && $('.story-voice[data-lang="zh"]').selectedIndex === 1, '同名的标准版也选得上');
    state().stories.voices.zh = 'Tingting';
    log(w.Baby.app.voiceFor('zh').name === 'Tingting', '以前存的声音名字也认');
    pickVoice('Meijia');
    log(state().stories.voices.zh === 'Meijia' && lastSaid().voice.name === 'Meijia', '换声音马上用上');

    // 读到最后
    for (let i = 0; i < 40 && $('.story-player'); i += 1) {
      endOne();
      await wait(380);
    }
    log(!$('.story-player') && /读完啦，晚安/.test(toastText()), '读完最后一段自动收尾', toastText());
    log(state().stories.done['prose-01'] === '2026-10-16' && /今晚读完了/.test(text('.story-done')), '记下今晚读完了');
    await wait(0);
    log(held() === 0, '读完恢复自动锁屏');
    await nav('#/');
    log(text('.story-card-title') === '匆匆' && /今晚读过了/.test(text('.story-card-meta')) && /再听一遍/.test(text('.story-card-go')), '首页卡片也显示读过了');
    await nav('#/tools/story');
    await loaded();

    // ---- 换一个、收藏、大字、不想再看到 ----
    click('[data-action="story-swap"]');
    const swapped = title();
    log(swapped && swapped !== '匆匆' && /^换成《/.test(toastText()), '换一个', swapped);
    click('[data-action="undo"]');
    log(title() === '匆匆', '撤销换一个');
    click('[data-action="story-swap"]');
    log(title() === swapped, '再换一次还是同一篇（按日期定的）', title());
    click('[data-action="story-swap"]');
    log(title() !== swapped && title() !== '匆匆', '再换就是新的一篇');
    await loaded();

    click('[data-action="story-fav"]');
    const favId = state().stories.tonight.id;
    log($('[data-action="story-fav"]').getAttribute('aria-pressed') === 'true' && state().stories.favorites.includes(favId), '收藏');
    log(/收藏/.test(text('#story-shelf .shelf-group:first-of-type .shelf-head')), '目录最上面多了收藏');
    click('[data-action="story-big"]');
    log($('.story-text.is-big') && state().stories.big === true, '大字');
    click('[data-action="story-big"]');

    const blockedTitle = title();
    const target = $('[data-action="story-block"]').dataset.target;
    click('[data-action="story-block"]');
    log(title() !== blockedTitle && state().stories.blocked.includes(target) && /以后不再推荐/.test(toastText()), '不想再看到就换掉', toastText());
    click('[data-action="undo"]');
    log(title() === blockedTitle && !state().stories.blocked.length, '撤销不想再看');
    click('[data-action="story-block"]');
    click('#story-shelf summary');
    await wait(30);
    const restore = $(`[data-action="story-unblock"][data-target="${target}"]`);
    log(restore, '目录里能恢复隐藏的');
    restore.click();
    log(!state().stories.blocked.length && $('#story-shelf').open, '恢复后目录还开着');

    // ---- 读完按钮、换语言 ----
    click('[data-action="story-pick"][data-id="aesop-01"]');
    log(await loaded() && $('.story-text').getAttribute('lang') === 'en' && $('.story-sub'), '英文寓言：小标题单独一行');
    click('[data-action="story-done"]');
    log(state().stories.done['aesop-01'] && /今晚读完了/.test(text('.story-done')), '点「读完了」');
    click('[data-action="undo"]');
    log(!state().stories.done['aesop-01'] && $('[data-action="story-done"]'), '撤销读完');
    click('[data-action="story-lang"][data-lang="zh"]');
    log($('.story-title').getAttribute('lang') === 'zh-CN' && state().stories.lang === 'zh', '只要中文：今晚换成中文', title());
    log($('[data-action="story-lang"][data-lang="zh"]').getAttribute('aria-pressed') === 'true', '选中的高亮');
    log(!$('.story-voice[data-lang="en"]'), '只要中文时不显示英文声音');
    click('[data-action="story-lang"][data-lang="all"]');

    // ---- 离开页面就停 ----
    await loaded();
    click('[data-action="story-play"]');
    log(current && $('.story-player'), '又开始读');
    const cancelled = cancels;
    await nav('#/');
    log(!current && cancels > cancelled, '离开故事页就停下');
    await wait(0);
    log(held() === 0, '离开后恢复自动锁屏');
    await nav('#/tools/story');
    log(!$('.story-player') && /朗读/.test(text('.story-actions [data-action="story-play"]')), '回来是没在读的样子');

    // ---- 没联网：挑一部还没下载过的 ----
    const fresh = ['andersen', 'potter', 'hulan', 'pooh', 'xiaopo'].find((c) => !w.Baby.app.storyTexts[c]);
    const offlineId = `${fresh}-02`;
    const offlineTitle = w.Baby.storyIndex.stories.find((s) => s.id === offlineId).title;
    const realFetch = w.fetch;
    w.fetch = () => Promise.reject(new Error('offline'));
    click('#story-shelf summary');
    await wait(30);
    click(`[data-action="story-pick"][data-id="${offlineId}"]`);
    await until(() => /没下载下来/.test(text('.story-text')));
    log(/没下载下来/.test(text('.story-text')) && $('[data-action="story-retry"]'), '没联网时提示，可以再试', text('.story-text'));
    log($('.story-actions [data-action="story-play"]').disabled, '没正文时朗读按钮不能点');
    w.fetch = realFetch;
    click('[data-action="story-retry"]');
    log(await loaded() && title() === offlineTitle, '再试一次就好了', `${title()} / ${offlineTitle}`);

    // ---- 保存 ----
    await reload();
    await nav('#/tools/story');
    log(title() === offlineTitle && state().stories.favorites.includes(favId), '刷新后今晚的故事和收藏都还在');
    const old = state();
    delete old.stories;
    w.localStorage.setItem('pregnancy-desk:v1', JSON.stringify(old));
    await reload();
    await nav('#/tools/story');
    log(await loaded() && title(), '没有故事记录的老数据也能打开');
  } catch (e) {
    log(false, '脚本异常', `${e.message}\n${e.stack}`);
  }
  log(errors.length === 0, '页面没有报错', errors.join(' | '));
  document.getElementById('out').textContent = `DONE\n${out.join('\n')}`;
};
</script>
</body>
