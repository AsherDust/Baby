<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}</style>
</head><body>
<script src="load-core.js"></script>
<script src="scenes.js"></script>
<script>
// 截图用的预览页，参数：
//   s      数据场景：empty / main / fresh / checkup-day / late / bag-done / labor
//   today  假装今天是哪天，默认 2026-10-12
//   w      页面宽度（px），手机用 390
//   r      打开哪一页，例如 records/glucose
//   stage / scroll / click / open / paste  打开后点哪里、滚到哪里、往 B 超粘贴框里填什么
//   errors 页面报错时写进标题
//   ios    假装是 iPhone：safari / wechat / app（从主屏幕图标打开）
//   hour   假装现在几点，例如 21 看晚上首页的故事卡片
//   story / reading  今晚读哪篇（例如 prose-07）、假装朗读暂停在第几段（从 0 数）
//   profile 改几项资料（JSON），例如 {"preWeight":48} 看体重长得偏快的样子
//   then   打开弹窗以后再滚到哪里，例如 .settings-family
//   merge  假装收到家人发来的文件，打开「合并家人的记录」：1 只打开，apply 再点「合并」
//   cloud  云同步：setup 打开设置面板（help=1 展开怎么创建 Token）；ok / error / offline 是设置好了以后同步成功、出错、没联网
const p = new URLSearchParams(location.search);
const scenario = p.get('s') || 'empty';
const today = p.get('today') || '2026-10-12';
localStorage.clear();
const seeded = seedScene(scenario);
if (seeded && p.get('profile')) Object.assign(seeded.profile, JSON.parse(p.get('profile')));
if (seeded) localStorage.setItem('honey-pot:v1', JSON.stringify(seeded));
const cloudMode = p.get('cloud');
if (['ok', 'error', 'offline'].includes(cloudMode)) {
  localStorage.setItem('honey-pot:v1:cloud', JSON.stringify({
    repo: 'AsherDust/BabySync', branch: 'main', folder: 'honey-pot', token: 'x', key: btoa('k'.repeat(32)), salt: 'AAAA', iter: 1000, files: {}, head: 'h1', last: Date.now() - 3600e3,
  }));
}
const w = p.get('w');
document.write(`<iframe src="../../index.html?today=${today}#/${p.get('r') || ''}" style="width:${w ? `${w}px` : '100%'}"></iframe>`);
document.querySelector('iframe').addEventListener('load', (e) => {
  const d = e.target.contentDocument;
  const fw = e.target.contentWindow;
  if (p.get('ios')) {
    const ua = `Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1${p.get('ios') === 'wechat' ? ' MicroMessenger/8.0.50' : ''}`;
    const props = { userAgent: ua, platform: 'iPhone', standalone: p.get('ios') === 'app' };
    for (const [k, v] of Object.entries(props)) Object.defineProperty(fw.navigator, k, { value: v, configurable: true });
    fw.dispatchEvent(new fw.StorageEvent('storage', { key: 'honey-pot:v1' }));
  }
  // mute=1：假装声音放得出来（无头浏览器不让自动放声音），截哄睡声音正在放的样子
  if (p.get('mute')) fw.HTMLMediaElement.prototype.play = () => Promise.resolve();
  // 假的 GitHub：ok 什么都答应，error 说 Token 不对，offline 连不上
  if (cloudMode === 'ok') {
    fw.fetch = async (url, opts = {}) => {
      const path = new URL(url).pathname;
      const body = /\/git\/ref\/heads\//.test(path) && !opts.method ? { object: { sha: 'h1' } }
        : /\/git\/commits\//.test(path) ? { tree: { sha: 't1' } } : { sha: 'c2', object: { sha: 'c2' } };
      return new fw.Response(JSON.stringify(body), { status: 200 });
    };
  }
  if (cloudMode === 'error') fw.fetch = async () => new fw.Response('{"message":"Bad credentials"}', { status: 401 });
  if (cloudMode === 'offline') fw.fetch = () => Promise.reject(new TypeError('Failed to fetch'));
  if (p.get('hour')) {
    const [y, m, day] = today.split('-').map(Number);
    const at = new Date(y, m - 1, day, Number(p.get('hour'))).getTime();
    fw.Date.now = () => at;
  }
  if (p.get('story')) fw.Baby.stories.select(fw.Baby.storyIndex, fw.Baby.app.state.stories, today, p.get('story'));
  if (p.get('hour') || p.get('story')) fw.Baby.app.render();
  if (p.get('stage')) d.querySelector(`[data-action="med-stage"][data-stage="${p.get('stage')}"]`).click();
  if (p.get('scroll')) d.querySelector(p.get('scroll')).scrollIntoView();
  if (p.get('click')) d.querySelector(p.get('click')).click();
  if (p.get('open')) d.querySelector(`[data-action="open-${p.get('open')}"]`).click();
  if (cloudMode === 'setup') {
    fw.Baby.app.actions['cloud-setup']();
    if (p.get('help')) d.querySelector('.cloud-help').open = true;
    d.activeElement.blur();
  }
  if (p.get('then')) d.querySelector(p.get('then')).scrollIntoView({ block: 'center' });
  if (p.get('merge')) {
    // 爸爸那台：昨晚多记了两顿奶、两次尿布，删了一条重复的，改了一条备注，还量了体重、记了第一次笑
    const B = fw.Baby.baby;
    const dad = JSON.parse(JSON.stringify(fw.Baby.app.state));
    fw.Baby.merge.track(dad);
    const b = dad.baby;
    const prev = fw.Baby.dates.addDays(today, -1);
    const late = B.msAt(today, '23:59');
    [['bottle', '19:00', { ml: '100', milk: 'formula' }], ['diaper', '19:15', { pee: true }], ['bottle', '21:30', { ml: '90', milk: 'formula' }],
      ['diaper', '21:40', { pee: true, poo: true, color: 'yellow' }]].forEach(([type, time, f]) => B.addLog(b, B.readLog(type, { date: prev, time, ...f }, late)));
    B.removeLog(b, b.logs.find((l) => l.type === 'diaper' && fw.Baby.dates.localISO(new Date(l.start)) === prev).id);
    b.logs.find((l) => l.type === 'breast' && fw.Baby.dates.localISO(new Date(l.start)) === today).note = '左边吃得多';
    B.setGrowth(b, { date: today, weight: '5.4', length: '', head: '' });
    b.milestones.smile = '2026-09-28';
    fw.Baby.merge.track(dad);
    fw.Baby.app.previewMerge(fw.Baby.storage.backupText(dad, new Date(`${today}T13:30:00Z`)));
    // 真机上是点完按钮、选完文件才打开，不会有键盘焦点的框
    d.activeElement.blur();
    if (p.get('merge') === 'apply') d.querySelector('[data-action="merge-apply"]').click();
  }
  if (p.get('paste')) {
    const t = d.getElementById('us-paste');
    t.value = p.get('paste');
    t.dispatchEvent(new e.target.contentWindow.InputEvent('input', { bubbles: true }));
  }
  if (p.get('errors')) fw.addEventListener('error', (ev) => { document.title = `ERR ${ev.message}`; });
  if (p.get('reading')) {
    const tick = setInterval(() => {
      const paras = d.querySelectorAll('.story-p');
      if (!paras.length) return;
      clearInterval(tick);
      const id = fw.Baby.stories.tonight(fw.Baby.storyIndex, fw.Baby.app.state.stories, today).id;
      fw.Baby.app.ui.reading = { id, index: Number(p.get('reading')), total: paras.length, playing: false };
      fw.Baby.app.render();
      d.querySelector('.story-p.is-reading').scrollIntoView({ block: 'center' });
    }, 50);
  }
});
</script>
</body></html>
