<!doctype html><meta charset="utf-8"><body><pre id="out">RUNNING</pre>
<script src="load-core.js"></script>
<script src="scenes.js"></script>
<script>
// 宝宝成长：出生、底部菜单换成「宝宝」、一键记、补记修改、成长档案、里程碑、疫苗、体温用药、辅食、产检收进记录、清除
const out = [];
const log = (ok, name, extra = '') => out.push(`${ok ? 'PASS' : 'FAIL'} ${name}${extra && !ok ? ` — ${extra}` : ''}`);
const TODAY = '2026-10-12';
const KEY = 'pregnancy-desk:v1';
const iframe = document.createElement('iframe');
iframe.style.cssText = 'width:390px;height:844px';
document.body.appendChild(iframe);

let w, d;
const errors = [];
const blobs = [];
let fakeNow = new Date(2026, 9, 12, 9, 0).getTime();
function bind() {
  w = iframe.contentWindow;
  d = iframe.contentDocument;
  w.addEventListener('error', (e) => errors.push(e.message));
  w.confirm = () => true;
  w.Date.now = () => fakeNow;
  w.URL.createObjectURL = (b) => { blobs.push(b); return 'blob:fake'; };
  w.URL.revokeObjectURL = () => {};
  w.HTMLAnchorElement.prototype.click = function () {};
}
const open = (scene, route = '') => {
  localStorage.clear();
  const s = seedScene(scene);
  if (s) localStorage.setItem(KEY, JSON.stringify(s));
  return new Promise((r) => {
    iframe.onload = r;
    iframe.src = `../../index.html?today=${TODAY}&n=${Math.random()}#/${route}`;
  }).then(() => { bind(); w.Baby.app.render(); });
};
const $ = (s) => d.querySelector(s);
const $$ = (s) => [...d.querySelectorAll(s)];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const nav = async (hash) => {
  await wait(40);
  if (w.location.hash === hash) return;
  await new Promise((r) => { w.addEventListener('hashchange', () => r(), { once: true }); w.location.hash = hash; });
};
const state = () => JSON.parse(w.localStorage.getItem(KEY));
const baby = () => state().baby;
const text = (el) => (el ? el.textContent.replace(/\s+/g, ' ').trim() : '');
const toastText = () => text(d.getElementById('toast'));
const sheet = () => d.getElementById('sheet-dialog');
const tabs = () => $$('.tabbar .tab-name').map((t) => t.textContent).join(',');
const later = (min) => { fakeNow += min * 60000; };
const click = async (sel) => { const el = $(sel); if (!el) throw new Error(`找不到 ${sel}`); el.click(); await wait(30); };

(async () => {
  try {
    // ---- 孕晚期：宝宝出生了 ----
    await open('labor');
    log($('.born-card') && tabs() === '今天,记录,心情,产检,工具', '孕晚期首页问「宝宝出生了吗」，底部还是产检');
    await nav('#/tools/weaning');
    log(text($('.page-title')) === '辅食食谱' && $$('.baby-food-all .dish').length === w.Baby.babyFood.recipes.length && $('.food-amounts thead'), '孕期也能先看辅食食谱：全部按月龄排好');
    const dots = $$('.baby-food-all .dish-open .dish-dot');
    log(dots.length === w.Baby.babyFood.recipes.length && dots.every((el) => ['--a', '--b'].every((v) => /^#[0-9A-F]{6}$/.test(el.style.getPropertyValue(v).trim()))), '每道辅食前面都有两种颜色的小圆点');
    await click('#food-pork-puree');
    log(sheet().open && sheet().querySelectorAll('.recipe-steps li').length > 0 && !sheet().querySelector('[data-action="baby-food-log"]'), '打开做法看看，还不能记吃了');
    log(sheet().querySelector('h2 .dish-dot') && text(sheet().querySelector('h2')) === '猪肉泥', '做法的标题前也有小圆点');
    await click('#sheet-dialog [data-action="close-dialog"]');
    await nav('#/tools/papers');
    log(text($('.page-title')) === '办证清单' && $$('.paper').length === 8 && $$('.paper input:disabled').length === 8 && /出生一件事/.test(text($('.papers-intro'))) && /先办好「出生医学证明」/.test(text($('.paper-waiting'))), '孕期先看办证清单：上海的「出生一件事」，出生后才能勾');
    await nav('#/');
    await click('.born-card [data-action="baby-birth-open"]');
    const f = sheet().querySelector('form[data-form="baby-birth"]');
    log(sheet().open && f.elements.name.value === '豆豆', '打开出生面板，小名先填好了');
    f.requestSubmit();
    await wait(30);
    log(/选一下是男宝还是女宝/.test(text(f.querySelector('.form-error'))), '没选性别不让存');
    f.querySelector('input[name="sex"][value="girl"]').checked = true;
    f.elements.name.value = '小米';
    f.elements.birthDate.value = '2026-10-10';
    f.elements.weight.value = '6.8斤';
    f.elements.length.value = '50';
    f.requestSubmit();
    await wait(40);
    const b0 = baby();
    log(b0 && b0.name === '小米' && b0.sex === 'girl' && b0.growth[0].weight === 3.4 && state().profile.nickname === '小米', '宝宝出生记下了，出生体重按斤换成千克');
    log(tabs() === '今天,记录,心情,宝宝,工具' && $('.hero-baby') && /第\s*3\s*天/.test(text($('.panel-baby-age'))) && /欢迎小米|小米的第一天/.test(toastText()), '底部换成「宝宝」，首页换成宝宝的一天', `${tabs()} ${toastText()}`);
    log(!$('.born-card') && /小米 2 天 · 蜜罐/.test(d.title), '不再问出生了，网页标题写着宝宝几天', d.title);
    const momMeal = $$('.panel-today .todo-item').find((li) => /妈妈.*吃什么/.test(li.textContent));
    log(momMeal && /妈妈早餐吃什么/.test(text(momMeal)) && momMeal.querySelector('.meal-chip'), '宝宝首页也有妈妈下一顿吃什么', text(momMeal));
    await nav('#/tools');
    log($('[data-tool="recipes"] .tool-name').textContent === '哺乳食谱', '工具里的「孕期食谱」换成「哺乳食谱」');
    await nav('#/tools/recipes');
    log(text($('.page-title')) === '哺乳食谱' && /坐月子 · 宝宝 2 天/.test(text($('.recipe-intro .eyebrow'))) && /产后头几天/.test(text($('.recipe-tip'))) && /2100 毫升/.test(text($('.recipe-tip'))), '按坐月子配：先吃软烂的，每餐有汤水', text($('.recipe-intro')));
    log($$('.meal').length === 5 && $$('.dish-open').length === 9 && $('#dish-lunch-soup') && $('#dish-night-snack'), '一天五顿九道：午餐也有汤，多一顿睡前加餐');
    await nav('#/');
    log(/出生后要办的事 0\/8/.test(text($('.panel-today'))) && /下一件：出生医学证明/.test(text($('.panel-today'))), '宝宝首页提醒出生后要办的事');
    await nav('#/tools/papers');
    log(/办好了 0\/8/.test(text($('.card-papers .card-meta'))) && !$('.paper input:disabled'), '出生后能勾了');
    await click('#paper-cert');
    log(baby().papers.cert === TODAY && /「出生医学证明」办好了/.test(toastText()) && $('.paper-done') && !/先办好「出生医学证明」/.test(text($('.card-papers'))), '勾上出生医学证明，落户不用再等它', toastText());
    await click('#toast [data-action="undo"]');
    log(!baby().papers.cert && /办好了 0\/8/.test(text($('.card-papers .card-meta'))), '勾错了能撤销');
    await click('#paper-cert');
    await click('#paper-hukou');
    await nav('#/tools');
    log(/办好了 2\/8 · 下一件：居民医保参保、缴费/.test(text($('[data-tool="papers"]'))), '工具页那一格写着办了几件、下一件', text($('[data-tool="papers"]')));
    await nav('#/');

    // ---- 首页一键记 ----
    await click('#breast-left');
    log($('.qt.is-live') && /亲喂中 · 左边/.test(text($('.qt.is-live'))), '点「左边」开始计时');
    later(6);
    await click('#breast-right');
    later(4);
    await click('#breast-stop');
    const feed = baby().logs.find((l) => l.type === 'breast');
    log(feed && feed.left === 360 && feed.right === 240 && feed.end === fakeNow, '换边接着计，喂完了左 6 分右 4 分', JSON.stringify(feed));
    log(/亲喂记好了：左 6 分 · 右 4 分/.test(toastText()), '提示喂了多久', toastText());
    await click('#sleep-toggle');
    log(/睡着了/.test(text($('.qt.is-sleep'))) && baby().logs.some((l) => l.type === 'sleep' && l.end === null), '点「睡着了」开始计时');
    await nav('#/records');
    log($('.live-bar .live-sleep') && /睡着了/.test(text($('.live-bar'))), '换到别的页面挂着「睡着了」的计时条');
    await nav('#/');
    log(!$('.live-bar'), '首页自己有计时，不挂计时条');
    later(50);
    await click('#sleep-toggle');
    log(/睡了 50 分钟，醒啦/.test(toastText()), '醒了：提示睡了多久', toastText());
    await click('#diaper-poo');
    log(baby().logs.some((l) => l.type === 'diaper' && l.poo && !l.pee) && $('#toast [data-action="undo"]'), '点「便」马上记一笔，可以撤销');
    await click('#toast [data-action="undo"]');
    log(!baby().logs.some((l) => l.type === 'diaper'), '撤销了');
    await click('#diaper-both');
    await click('#log-bottle');
    const bf = sheet().querySelector('form[data-form="baby-log"]');
    log(sheet().open && bf.dataset.type === 'bottle', '「记一瓶」打开瓶喂面板');
    sheet().querySelector('[data-action="baby-ml"][data-ml="90"]').click();
    log(d.getElementById('sheet-ml').value === '90', '点 90 填好毫升');
    bf.requestSubmit();
    await wait(40);
    const s1 = w.Baby.baby.daySummary(w.Baby.app.state.baby, TODAY, fakeNow);
    log(s1.feeds === 2 && s1.bottleMl === 90 && s1.sleepMin === 50 && s1.diapers === 1 && /瓶喂 90 毫升/.test(text($('.bsum'))), '今天的小结：喂奶 2 次、瓶喂 90 毫升、睡 50 分钟、尿布 1 次', text($('.bsum')));
    await click('#vitd-done');
    log($$('.panel-today .todo-item.is-done').some((li) => /维生素 D 喂过了/.test(li.textContent)), '维生素 D 点「喂过了」就勾上');

    // ---- 宝宝页：日常 ----
    await nav('#/baby');
    log($$('.seg-tab').map((t) => t.textContent).join() === '日常,成长,疫苗,体检,健康,辅食' && $$('.blog').length === 5, '宝宝页六个分页，今天的记录 5 条', `${$$('.blog').length}`);
    const diaper = baby().logs.find((l) => l.type === 'diaper');
    await click(`#edit-${diaper.id}`);
    const ef = sheet().querySelector('form[data-form="baby-log"]');
    ef.querySelector('input[name="color"][value="white"]').checked = true;
    ef.requestSubmit();
    await wait(40);
    log(baby().logs.find((l) => l.id === diaper.id).color === 'white' && /胆道/.test(text($('.blog.is-warn'))), '改成灰白色的便：记录里提醒尽快去医院');
    const bottle = baby().logs.find((l) => l.type === 'bottle');
    await click(`#edit-${bottle.id}`);
    await click('#sheet-dialog [data-action="baby-delete"]');
    log(!baby().logs.some((l) => l.type === 'bottle') && /删掉了这条瓶喂/.test(toastText()), '删掉一条');
    await click('#toast [data-action="undo"]');
    log(baby().logs.some((l) => l.id === bottle.id), '删了也能撤销');
    await click('#baby-prev');
    log(/昨天/.test(text($('.day-title'))) && !$('.quick-tiles'), '看昨天：没有一键记的按钮');
    await click('#baby-prev');
    log($('#baby-prev').disabled && /10月10日/.test(text($('.day-title'))), '翻到出生那天就不能再往前了');
    await click('#log-more');
    const pf = sheet().querySelector('form[data-form="baby-log"]');
    log(pf.elements.date.value === '2026-10-10', '在那天补一条，日期就是那天');
    sheet().querySelector('[data-action="baby-log-type"][data-type="sleep"]').click();
    await wait(20);
    const sf = sheet().querySelector('form[data-form="baby-log"]');
    sf.elements.time.value = '22:00';
    sf.elements.endTime.value = '01:30';
    sf.requestSubmit();
    await wait(40);
    const night = baby().logs.find((l) => l.type === 'sleep' && l.start === new Date(2026, 9, 10, 22, 0).getTime());
    log(night && night.end === new Date(2026, 9, 11, 1, 30).getTime(), '补记一觉：睡到第二天凌晨也对');
    await click('#baby-next');
    await click('#baby-next');
    log(/今天/.test(text($('.day-title'))) && $('#baby-next').disabled, '回到今天');

    // ---- 成长档案 ----
    await nav('#/baby/growth');
    log($('#growth-chart svg') && $$('#growth-chart .c-pline').length === 5 && $$('#growth-chart circle').length === 1, '生长曲线：5 条百分位线和出生时的点');
    const gf = $('form[data-form="baby-growth"]');
    d.getElementById('g-weight').value = '3.3';
    gf.requestSubmit();
    await wait(40);
    log(baby().growth.length === 2 && $$('.gr-item').length === 2 && $$('#growth-chart circle').length === 2, '记一次体重，曲线上多一个点');
    await click('#metric-length');
    log(/身长生长曲线/.test($('#growth-chart svg').getAttribute('aria-label')) && d.activeElement.id === 'metric-length', '切到身长');
    await click('.gr-item [data-action="growth-delete"]');
    log(baby().growth.length === 1, '删掉一次');
    await click('#toast [data-action="undo"]');
    log(baby().growth.length === 2, '删了能撤销');
    await click('#ms-smile');
    sheet().querySelector('form[data-form="milestone"]').requestSubmit();
    await wait(40);
    log(baby().milestones.smile === TODAY && /「会对人笑」记下了/.test(toastText()) && $('.ms-smile, .ms.ms-done'), '里程碑记下了', toastText());
    await click('#ms-smile');
    await click('#sheet-dialog [data-action="milestone-clear"]');
    log(!baby().milestones.smile, '改回还没会');
    d.getElementById('mo-name').value = '第一次洗澡';
    $('form[data-form="baby-moment"]').requestSubmit();
    await wait(40);
    log(baby().moments.length === 1 && /第一次洗澡/.test(text($('.ms-moments'))), '记一件「第一次」');

    // ---- 疫苗 ----
    await nav('#/baby/vaccines');
    log(/下一针：乙肝疫苗第 1 剂/.test(text($('.remind-strip'))), '下一针是乙肝第 1 剂', text($('.remind-strip')));
    await click('#vx-done-hepb-1');
    log(baby().vaccines['hepb-1'].done === TODAY && /已经打完 1 针/.test(text($('#vx-done summary'))), '点「打完了」，收进已经打完的');
    await click('#vx-open-bcg');
    const vf = sheet().querySelector('form[data-form="vaccine"]');
    vf.elements.booked.value = '2026-10-13';
    vf.requestSubmit();
    await wait(40);
    log(baby().vaccines.bcg.booked === '2026-10-13' && /约在 10月13日/.test(text($('.remind-strip'))), '约好卡介苗明天打');
    blobs.length = 0;
    await click('[data-action="vaccine-ics"]');
    const ics = blobs.length ? await blobs[0].text() : '';
    log(/X-WR-CALNAME:疫苗接种/.test(ics) && (ics.match(/BEGIN:VEVENT/g) || []).length >= 10 && /DTSTART;VALUE=DATE:20261013/.test(ics), '导出疫苗日历，约好的按约的日子', ics.slice(0, 80));
    d.getElementById('xv-name').value = '乙肝免疫球蛋白';
    $('form[data-form="extra-vaccine"]').requestSubmit();
    await wait(40);
    log(baby().extraVaccines.length === 1 && baby().extraVaccines[0].done, '自费疫苗自己加');
    await nav('#/');
    log(/明天打疫苗：卡介苗第 1 剂/.test(text($('.banner'))) && $('.tab-dot'), '首页提醒明天打疫苗，底部「宝宝」有红点');
    log(/下一次体检：产后访视/.test(text($('.panel-today'))) && /10月13日起可以去/.test(text($('.panel-today'))), '首页说下一次体检是产后访视，10月13日起可以去', text($('.panel-today')).slice(0, 200));

    // ---- 体检 ----
    await nav('#/baby/exams');
    log($$('.baby-exams .vx').length === 10 && /下一次：产后访视 · 10月13日起可以去/.test(text($('.remind-strip'))), '体检页列出 10 次，下一次是产后访视', text($('.remind-strip')));
    log(/妈妈和宝宝/.test(text($('.baby-exams .vx'))) && !$('#ex-done-m36'), '产后访视标着妈妈和宝宝；还早的那几次没有「做完了」');
    await click('#ex-book-d42');
    log(sheet().open && /查什么/.test(text(sheet())) && /回分娩的医院/.test(text(sheet())) && /上海是产后 42 天母婴一起回分娩医院查/.test(text(sheet())), '产后 42 天检查：去哪、查什么，按上海的做法');
    await click('#sheet-dialog [data-action="close-dialog"]');
    await click('#ex-book-visit');
    const xf = sheet().querySelector('form[data-form="exam"]');
    xf.elements.done.value = '2026-10-20';
    xf.requestSubmit();
    await wait(30);
    log(sheet().open && /不能晚于今天/.test(text(xf.querySelector('.form-error'))), '做完的日子不能填以后');
    xf.elements.done.value = '';
    xf.elements.booked.value = '2026-10-13';
    xf.requestSubmit();
    await wait(40);
    log(baby().exams.visit.booked === '2026-10-13' && /约在/.test(text($('.remind-strip'))) && /约好了/.test(toastText()), '约好产后访视明天来');
    await click('.ex-name[data-id="m3"]');
    log(sheet().querySelectorAll('.exam-watch li').length === 4 && /很大的声音也没有反应/.test(text(sheet())), '3 个月体检列出 4 条要留意');
    await click('#sheet-dialog [data-action="close-dialog"]');
    blobs.length = 0;
    await click('[data-action="exam-ics"]');
    const eics = blobs.length ? await blobs[0].text() : '';
    log(/X-WR-CALNAME:儿保体检/.test(eics) && (eics.match(/BEGIN:VEVENT/g) || []).length === 10 && /DTSTART;VALUE=DATE:20261013/.test(eics) && /导出了 10 次体检/.test(toastText()), '导出体检日历，约好的按约的日子', eics.slice(0, 80));
    await nav('#/');
    log(/明天体检：产后访视/.test(text($('.banner'))), '首页横幅提醒明天体检');
    await nav('#/baby/exams');
    await click('#ex-done-visit');
    log(baby().exams.visit.done === TODAY && /已经做过 1 次/.test(text($('#ex-done summary'))) && /产后访视/.test(toastText()), '点「做完了」，收进已经做过的', toastText());

    // ---- 体温、用药 ----
    await nav('#/baby/health');
    d.getElementById('bt-value').value = '38.4';
    $('form[data-form="baby-temp"]').requestSubmit();
    await wait(40);
    log(/有点发热/.test(toastText()) && /3 个月以下的宝宝发热，尽快去医院/.test(text($('.rec-alert'))) && /中等发热/.test(text($('.temp-now'))), '发热：3 个月以下提醒尽快去医院', text($('.temp-now')));
    await click('[data-action="baby-med-fill"]');
    log(d.getElementById('bm-name').value === '维生素 D', '点「维生素 D」填好药名');
    $('form[data-form="baby-med"]').requestSubmit();
    await wait(40);
    log(baby().logs.filter((l) => l.type === 'med').length === 2, '记下用药');

    // ---- 辅食（还不到 6 个月） ----
    await nav('#/baby/food');
    log(/还不到 6 个月/.test(text($('.baby-food-stage'))) && !$('.baby-food-today') && $$('.baby-food-all .dish').length > 25, '不到 6 个月：先看看，不推荐今天做什么');

    log(sheet().open && !sheet().querySelector('[data-action="baby-food-log"]'), '还不能记吃了');

    // ---- 产检收进记录，工具收起孕期的 ----
    await nav('#/records/weight');
    log($$('.seg-tab').some((t) => t.getAttribute('href') === '#/checkups/schedule'), '「记录」里能看产检');
    await nav('#/checkups/schedule');
    log(text($('.tab[aria-current="page"]')) === '记录' && $('.seg-tab[aria-current="page"]').getAttribute('href') === '#/checkups/schedule', '产检页亮的是「记录」');
    await nav('#/tools');

    await nav('#/tools/pelvic');
    log(/剖宫产都可以轻轻地开始练/.test(text($('.fineprint'))) && /恶露干净后/.test(text($('.fineprint'))), '产后的盆底练习：顺产剖宫产都能开始，6 周后去做盆底评估');

    // ---- 刷新、清除 ----
    await new Promise((r) => { iframe.onload = r; w.location.reload(); });
    bind();
    await wait(40);
    log(w.Baby.app.state.baby.name === '小米' && w.Baby.app.state.baby.logs.length >= 7, '刷新后都还在');
    await click('[data-action="open-settings"]');
    log(/小米 · 女宝/.test(text(d.getElementById('settings-dialog'))), '设置里有宝宝信息');
    await click('#settings-dialog [data-action="baby-birth-open"]');
    await wait(60);
    await click('#sheet-dialog [data-action="baby-clear"]');
    await wait(40);
    log(!state().baby && tabs() === '今天,记录,心情,产检,工具' && /宝宝的信息清掉了/.test(toastText()), '清除宝宝信息，回到孕期');
    await click('#toast [data-action="undo"]');
    log(state().baby && state().baby.name === '小米', '清除也能撤销');

    // ---- 7 个月：辅食 ----
    fakeNow = new Date(2026, 9, 12, 19, 0).getTime();
    await open('baby-7m', 'baby/food');
    const picks = $$('.baby-food-today .dish-open');
    log(/7～9 个月/.test(text($('.baby-food-stage .eyebrow'))) && $('.food-amounts') && picks.length === 3, '7 个月：阶段、每天吃多少、今天推荐 3 道');
    log(picks.filter((b) => b.querySelector('.tag-next')).length <= 1, '今天最多一道带新食材');
    await click('#food-liver-puree');
    log(/第一次/.test(text(sheet().querySelector('.recipe-items'))), '做法里标出第一次吃的食材');
    await click('#sheet-dialog [data-action="baby-food-log"]');
    log(/第一次吃猪肝/.test(toastText()) && baby().tried['猪肝'] === TODAY && baby().logs.some((l) => l.type === 'food' && l.recipe === 'liver-puree'), '记一笔：记进辅食，猪肝算吃过了', toastText());
    $('#food-tried summary').click();
    await wait(20);
    await click('#tried-香蕉');
    log(baby().tried['香蕉'] === TODAY && $('#food-tried').open, '自己勾上吃过的食材，面板保持展开');
    await click('#tried-香蕉');
    const ff = sheet().querySelector('form[data-form="food-feel"]');
    log(sheet().open && ff && /第一次吃/.test(text(sheet())), '吃过的再点一下，标一标吃得怎么样');
    await click('#sheet-dialog [data-action="feel-fill"][data-text="起疹子"]');
    log(ff.elements.note.value === '起疹子' && ff.querySelector('input[name="feel"][value="reaction"]').checked, '点「起疹子」顺手选上「有反应」');
    ff.requestSubmit();
    await wait(40);
    log(baby().foodNotes['香蕉'].feel === 'reaction' && /含香蕉的辅食先不推荐了/.test(toastText()) && /有过反应：香蕉（起疹子）/.test(text($('.food-reacted'))) && $('#tried-香蕉.chip-feel-reaction'), '记下有反应：顶上提醒，食材标红', toastText());
    log(/有过反应：香蕉/.test(text($('#food-banana-puree'))) && !$$('.baby-food-today .dish-open').some((x) => /香蕉/.test(x.textContent)), '香蕉泥标着有过反应，今天的推荐里没有它');
    await click('#food-banana-puree');
    log(/有过反应，这道先别做/.test(text(sheet().querySelector('.recipe-warn'))), '打开香蕉泥的做法也提醒');
    await click('#sheet-dialog [data-action="close-dialog"]');
    await click('#tried-香蕉');
    await click('#sheet-dialog [data-action="tried-clear"]');
    log(!baby().tried['香蕉'] && !baby().foodNotes['香蕉'] && /改回没吃过/.test(toastText()), '「没吃过」：一起清掉');
    await click('#tried-香蕉');
    await nav('#/');
    const expect = w.Baby.baby.foodToday(w.Baby.babyFood, w.Baby.babyBook, baby(), TODAY).map((r) => r.name);
    log(/下次大约 21:25/.test(text($('.panel-baby-now .next-feed'))) && /最近大约 3 小时 55 分喂一次，饿了就喂/.test(text($('.next-feed'))), '按最近的间隔估下次喂奶：大约 21:25', text($('.panel-baby-now')));
    const chips = $$('.panel-today .meal-chip[data-action="baby-food-open"]');
    log(expect.length && chips.map(text).join() === expect.join() && chips.every((c) => c.querySelector('.dish-dot')), '首页「今天的辅食」是带小圆点的菜名', chips.map(text).join());
    await click(`#${chips[0].id}`);
    log(sheet().open && text(sheet().querySelector('h2')) === expect[0] && sheet().querySelector('[data-action="baby-food-log"]'), '点菜名直接看做法，能记一笔');
    await click('#sheet-dialog [data-action="close-dialog"]');

    // ---- 产后心情关怀 ----
    for (let i = 0; i < 5; i += 1) w.Baby.journal.add(w.Baby.app.state, { date: w.Baby.dates.addDays(TODAY, -i), mood: 'low', text: '' }, TODAY, Date.now());
    w.Baby.app.render();
    log(/最近心情不太好的日子有点多/.test(text($('.panel-today'))), '宝宝首页也提一句心情');
    await nav('#/journal');
    log(/产后情绪起伏很常见/.test(text($('.mood-care'))) && /伤害宝宝/.test(text($('.mood-care'))) && /42 天复查/.test(text($('.mood-care'))), '产后的说法：夜里让家人分担，42 天复查时跟医生说说', text($('.mood-care')));

    log(errors.length === 0, '没有报错', errors.join(' | '));
  } catch (err) {
    log(false, `出错：${err.message}`, err.stack);
  }
  document.getElementById('out').textContent = `DONE\n${out.join('\n')}`;
})();
</script>
