<!doctype html><meta charset="utf-8"><body><pre id="out">RUNNING</pre>
<script>
localStorage.clear();
const out = [];
const log = (ok, name, extra = '') => out.push(`${ok ? 'PASS' : 'FAIL'} ${name}${extra && !ok ? ` — ${extra}` : ''}`);
const iframe = document.createElement('iframe');
iframe.style.cssText = 'width:1280px;height:900px';
iframe.src = '../../index.html?today=2026-10-12';
document.body.appendChild(iframe);

let w, d;
const errors = [];
const blobs = [];
function bind() {
  w = iframe.contentWindow;
  d = iframe.contentDocument;
  w.addEventListener('error', (e) => errors.push(e.message));
  w.confirm = () => true;
  w.URL.createObjectURL = (b) => { blobs.push(b); return 'blob:fake'; };
  w.URL.revokeObjectURL = () => {};
  w.HTMLAnchorElement.prototype.click = function () {};
}
const $ = (s) => d.querySelector(s);
const $$ = (s) => [...d.querySelectorAll(s)];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
// 先等一下，让关弹窗时的 history.back() 走完，再换页
const nav = async (hash) => {
  await wait(40);
  if (w.location.hash === hash) return;
  await new Promise((r) => { w.addEventListener('hashchange', () => r(), { once: true }); w.location.hash = hash; });
};
const state = () => JSON.parse(w.localStorage.getItem('pregnancy-desk:v1'));
const item = (id) => state().bag.find((b) => b.id === id);
const toastText = () => d.getElementById('toast').textContent;
const reload = () => new Promise((r) => { iframe.onload = r; w.location.reload(); }).then(bind);

iframe.onload = async () => {
  bind();
  try {
    const f = $('form[data-form="onboard"]');
    f.elements.dueDate.value = '2026-11-30';
    f.requestSubmit();
    const total = state().bag.length;
    log(/待产包还差 35 样/.test($('.panel-today').textContent), '33 周时首屏提醒待产包');
    $('.panel-today a[href="#/tools/bag"]').click();
    await nav('#/tools/bag');
    log($('.page-head .page-title').textContent === '待产包包' && $('.back[href="#/tools"]'), '点「去打勾」进入待产包页，有返回'); 
    log(total === 35 && $$('.bag-item').length === 35, '新用户自带 35 样默认清单', `${total}`);
    log(/已备好 0\/35/.test($('.card-bag .card-meta').textContent), '卡片显示已备好 0/35');

    $('#bag-item-id-cards').closest('.bag-check').querySelector('.bag-name').click();
    log(item('id-cards').done && $('#bag-item-id-cards').checked, '点文字就能打勾');
    log($('#bag-item-id-cards').closest('.bag-item').classList.contains('is-done'), '打勾后变成已备好样式');
    log(/1\/5/.test($('.bag-group-title').textContent) && /已备好 1\/35/.test($('.card-bag .card-meta').textContent), '分类和总数跟着更新');

    $('#bag-item-id-cards').focus();
    $('#bag-item-id-cards').click();
    log(!item('id-cards').done && !$('#bag-item-id-cards').checked, '再点一次取消勾选');
    log(d.activeElement && d.activeElement.id === 'bag-item-id-cards', '重绘后键盘焦点还在这个勾选框上', d.activeElement && d.activeElement.id);

    $('#bag-add-mom').click();
    log(d.activeElement && d.activeElement.id === 'bag-new' && /吸奶器/.test($('#bag-new').placeholder), '点「加一样」出现输入框并自动聚焦');
    $('#bag-new').value = '  吸奶器 ';
    $('#bag-new').form.requestSubmit();
    const mine = state().bag.find((b) => b.name === '吸奶器');
    log(mine && mine.group === 'mom' && mine.custom, '加上自己的物品');
    log($('#bag-new') && $('#bag-new').value === '' && d.activeElement.id === 'bag-new', '加完输入框清空，可以接着加');
    const momItems = $$('.bag-group')[1].querySelectorAll('.bag-name');
    log(momItems[momItems.length - 1].textContent === '吸奶器', '新加的排在分类最后');

    $('#bag-new').value = '保温杯';
    $('#bag-new').form.requestSubmit();
    log(/已经在清单里/.test(toastText()) && state().bag.length === 36, '重复的物品不会再加', toastText());
    $('#bag-new').value = '   ';
    $('#bag-new').form.requestSubmit();
    log(/先写上/.test(toastText()) && state().bag.length === 36, '空名字有提示', toastText());

    $('#bag-new').value = '口水巾';
    $('#bag-add-baby').click();
    log($('#bag-new').form.dataset.group === 'baby' && $('#bag-new').value === '', '换到另一个分类时输入框清空');
    $('#bag-new').dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    log(!$('#bag-new') && d.activeElement.id === 'bag-add-baby', '按 Esc 收起输入框，焦点回到按钮');

    const idx = state().bag.findIndex((b) => b.id === 'car-seat');
    $('[data-action="delete-bag-item"][data-id="car-seat"]').click();
    log(!item('car-seat') && !$('#bag-item-car-seat'), '删掉一样');
    $('[data-action="undo"]').click();
    log(state().bag.findIndex((b) => b.id === 'car-seat') === idx, '撤销后回到原来的位置');

    for (const b of state().bag) {
      if (!b.done) $(`#bag-item-${b.id}`).click();
    }
    log(state().bag.every((b) => b.done), '全部打勾');
    log(/备好了/.test(toastText()) && $('.bag-ready') && $('.bag-progress.is-full'), '备齐后有提示和绿色进度条', toastText());
    await nav('#/tools');
    log(/已备好 36\/36/.test($('.tool[data-tool="bag"]').textContent), '工具菜单里显示备好几样', $('.tool[data-tool="bag"]').textContent);
    await nav('#/');
    log(/待产包备齐了/.test($('.panel-today').textContent), '首屏显示待产包备齐了');
    await nav('#/tools/bag');

    $('[data-action="open-settings"]').click();
    d.getElementById('settings-dialog').querySelector('[data-action="reset-bag"]').click();
    const afterReset = state().bag;
    log(afterReset.filter((b) => !b.custom).every((b) => !b.done) && afterReset.find((b) => b.name === '吸奶器').done, '恢复默认：默认物品取消勾选，自己加的不动');
    $('[data-action="undo"]').click();
    log(state().bag.every((b) => b.done), '撤销恢复默认');

    $('[data-action="open-settings"]').click();
    d.getElementById('settings-dialog').querySelector('[data-action="export-backup"]').click();
    const backup = JSON.parse(await blobs[blobs.length - 1].text());
    log(Array.isArray(backup.bag) && backup.bag.length === 36, '备份里包含待产包');
    d.getElementById('settings-dialog').querySelector('[data-action="close-dialog"]').click();

    await reload();
    log(!!$('.bag-ready') && $$('.bag-item.is-done').length === 36, '刷新后勾选都还在');

    const old = state();
    delete old.bag;
    w.localStorage.setItem('pregnancy-desk:v1', JSON.stringify(old));
    await reload();
    log($$('.bag-item').length === 35 && $$('.bag-item.is-done').length === 0, '没有待产包的老数据，打开后自动补上默认清单');

    const s2 = state();
    s2.profile.dueDate = '2027-01-29';
    w.localStorage.setItem('pregnancy-desk:v1', JSON.stringify(s2));
    await reload();
    log(/32 周起/.test($('.card-bag .card-meta').textContent), '24 周时卡片里提示 32 周起准备');
    await nav('#/');
    log(!/待产包/.test($('.panel-today').textContent), '24 周时首屏不提醒待产包');
  } catch (e) {
    log(false, '脚本异常', `${e.message}\n${e.stack}`);
  }
  log(errors.length === 0, '页面没有报错', errors.join(' | '));
  document.getElementById('out').textContent = `DONE\n${out.join('\n')}`;
};
</script>
</body>
